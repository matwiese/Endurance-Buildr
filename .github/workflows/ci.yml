name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
  server-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buildr
          POSTGRES_PASSWORD: buildr
          POSTGRES_DB: buildr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buildr" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buildr/server exec vitest run
        env:
          TEST_DATABASE_URL: postgres://buildr:buildr@localhost:5432/buildr_test
  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ hashFiles('e2e/package.json') != '' && hashFiles('apps/web/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buildr/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
